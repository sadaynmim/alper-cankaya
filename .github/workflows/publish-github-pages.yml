name: Publish fan archive to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: github-pages-publish
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Build static site
        run: npm run build
      - name: Publish dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
      - name: Attempt to enable GitHub Pages automatically
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          HTTP=$(curl -sS -o /tmp/enable-pages.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data '{"source":{"branch":"gh-pages","path":"/"}}' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" || true)
          echo "Enable GitHub Pages API: HTTP=$HTTP"
          if [ "$HTTP" != "201" ] && [ "$HTTP" != "409" ]; then
            head -c 500 /tmp/enable-pages.json || true
            echo
          fi
      - name: Check public GitHub Pages URL
        shell: bash
        run: |
          SITE="https://sadaynmim.github.io/alper-cankaya"
          for attempt in 1 2 3; do
            HTTP=$(curl -sSL --connect-timeout 6 --max-time 15 -o /tmp/pages-index.html -w '%{http_code}' "$SITE/" || true)
            PHOTO=$(curl -sSL --connect-timeout 6 --max-time 15 -o /tmp/pages-photo.jpg -w '%{http_code}' "$SITE/media/sober-portrait-2026.jpg" || true)
            echo "Attempt $attempt: homepage HTTP=$HTTP, portrait HTTP=$PHOTO"
            if [ "$HTTP" = "200" ] && [ "$PHOTO" = "200" ] && grep -q 'media/sober-portrait-2026.jpg' /tmp/pages-index.html; then
              echo "PUBLIC_SITE_READY: original Sober portrait referenced by homepage."
              exit 0
            fi
            sleep 5
          done
          echo "PAGES_NOT_PUBLIC: enable Settings > Pages > Deploy from a branch > gh-pages > / (root)."
