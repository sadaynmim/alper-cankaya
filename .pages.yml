media:
  input: media
  output: /media

content:
  - name: appearance
    label: Home page image
    type: file
    path: content/site.json
    format: json
    fields:
      - name: hero_image
        label: Homepage portrait (black and white)
        type: image
        required: true
      - name: hero_focus
        label: Portrait crop / vertical focus
        type: select
        options:
          - name: "15%"
            label: High
          - name: "25%"
            label: Upper
          - name: "35%"
            label: Slightly above center
          - name: "45%"
            label: Center
          - name: "50%"
            label: Slightly below center
          - name: "60%"
            label: Low
          - name: "70%"
            label: Very low
      - name: hero_credit
        label: Photo credit
        type: string
      - name: hero_credit_url
        label: Original photo source (URL)
        type: string

  - name: biography
    label: Biography
    type: file
    path: content/bio.json
    format: json
    fields:
      - name: p1_en
        label: Paragraph 1 — English
        type: text
      - name: p2_en
        label: Paragraph 2 — English
        type: text
      - name: p3_en
        label: Paragraph 3 — English
        type: text
      - name: p4_en
        label: Paragraph 4 — English
        type: text
      - name: p5_en
        label: Paragraph 5 — English
        type: text

  - name: awards
    label: Awards
    type: collection
    path: content/awards
    format: json
    filename: "{primary}.json"
    fields:
      - name: year
        label: Year
        type: string
      - name: title_en
        label: Award — English
        type: string
        required: true
      - name: competition_en
        label: Competition — English
        type: string
      - name: festival_en
        label: Festival — English
        type: string
      - name: film
        label: Original film title
        type: string
      - name: film_en
        label: English film title
        type: string
      - name: director
        label: Director
        type: string
      - name: source_url
        label: Official source — English
        type: string
      - name: source_url_tr
        label: Official source — Turkish
        type: string

  - name: filmography
    label: Filmography
    type: collection
    path: content/works
    format: json
    filename: "{primary}.json"
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: year
        label: Year
        type: string
      - name: role
        label: Character
        type: string
      - name: kind
        label: Production type
        type: select
        options:
          - name: series
            label: TV series
          - name: film
            label: Film
          - name: theatre
            label: Theatre
      - name: tone
        label: Visual tone
        type: string
      - name: character_image
        label: Character photo
        type: image
      - name: character_image_credit
        label: Character photo credit
        type: string
      - name: character_image_source
        label: Character photo source (URL)
        type: string
      - name: description_en
        label: Character description — English
        type: text

  - name: gallery
    label: Photo Gallery
    type: collection
    path: content/gallery
    format: json
    filename: "{primary}.json"
    fields:
      - name: src
        label: Photo
        type: image
        required: true
      - name: credit
        label: Photo credit
        type: string
      - name: url
        label: Source link
        type: string
      - name: cat
        label: Category
        type: number

  - name: news
    label: News
    type: collection
    path: content/news
    format: json
    filename: "{primary}.json"
    fields:
      - name: title_en
        label: Headline — English
        type: string
        required: true
      - name: date
        label: Publication date
        type: date
        required: true
      - name: image
        label: Article image
        type: image
      - name: source
        label: Source name
        type: string
      - name: url
        label: Source link
        type: string
      - name: description_en
        label: Article — English
        type: text
