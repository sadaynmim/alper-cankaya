media:
  input: media
  output: /media

content:
  - name: biography
    label: Biography
    type: file
    path: content/bio.json
    format: json
    fields:
      - name: p1_en
        label: Paragraph 1 — English
        type: text
      - name: p2_en
        label: Paragraph 2 — English
        type: text

  - name: filmography
    label: Filmography
    type: collection
    path: content/works
    format: json
    filename: "{primary}.json"
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: year
        label: Year
        type: string
      - name: role
        label: Character
        type: string
      - name: kind
        label: Production type
        type: select
        options:
          - name: series
            label: TV series
          - name: film
            label: Film
          - name: theatre
            label: Theatre
      - name: tone
        label: Visual tone
        type: string
      - name: character_image
        label: Character photo
        type: image
      - name: description_en
        label: Character description — English
        type: text

  - name: gallery
    label: Photo Gallery
    type: collection
    path: content/gallery
    format: json
    filename: "{primary}.json"
    fields:
      - name: src
        label: Photo
        type: image
        required: true
      - name: credit
        label: Photo credit
        type: string
      - name: url
        label: Source link
        type: string
      - name: cat
        label: Category
        type: number

  - name: news
    label: News
    type: collection
    path: content/news
    format: json
    filename: "{primary}.json"
    fields:
      - name: title_en
        label: Headline — English
        type: string
        required: true
      - name: date
        label: Publication date
        type: date
        required: true
      - name: image
        label: Article image
        type: image
      - name: source
        label: Source name
        type: string
      - name: url
        label: Source link
        type: string
      - name: description_en
        label: Article — English
        type: text
